<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickslate widget gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="/src/themes/tokens.css">
<style>
  /* The page is pinned to Paper (data-theme="light" on <html>) so the Paper
     block below does not pick up an OS dark preference; the Traed Dark block
     opts in with its own data-theme. */
  body { margin: 0; background: var(--ts-bg); color: var(--ts-ink); font-family: var(--ts-font-ui); }
  .page { max-width: 1360px; margin: 0 auto; padding: 24px 24px 96px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-bottom: 8px; }
  h1 { font: 500 28px/1 var(--ts-font-num); margin: 0; flex: 1 1 auto; }
  h2 { font: 500 22px/1.2 var(--ts-font-num); margin: 0 0 16px; }
  h3 { font: 600 15px/1.2 var(--ts-font-ui); margin: 28px 0 12px; }
  h4 { font: 600 11px/1.2 var(--ts-font-ui); margin: 20px 0 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ts-muted); }
  a { color: var(--ts-accent); }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--ts-accent); outline-offset: 2px; }
  .intro { color: var(--ts-muted); font-size: 13px; margin: 0 0 16px; max-width: 80ch; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px 32px; margin: 0 0 24px; padding: 0; border: 0; }
  fieldset.control { margin: 0; padding: 10px 14px; border: 1px solid var(--ts-line); border-radius: var(--ts-radius-sm); background: var(--ts-surface); font-size: 13px; }
  fieldset.control legend { padding: 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ts-muted); }
  .control label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; min-height: 28px; cursor: pointer; }
  .control label:last-child { margin-right: 0; }

  /* Each theme block re-asserts the page colours from its own tokens. It scrolls
     sideways on a narrow screen rather than squeezing the real-size tiles. */
  .theme { margin: 0 0 32px; padding: 20px; background: var(--ts-bg); color: var(--ts-ink);
    border: 1px solid var(--ts-line); border-radius: var(--ts-radius); overflow-x: auto; }
  .theme:focus-visible { outline: 2px solid var(--ts-accent); outline-offset: 2px; }
  .set { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; }
  /* A phone's 2-column grid uses the tighter gap, so M is 310 tall there. */
  .set.phone { --ts-gap: var(--ts-gap-compact); gap: 10px 10px; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; font-size: 11px; color: var(--ts-muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 699px) { .page { padding: 16px; } .theme { padding: 12px; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Widget gallery</h1>
    <a href="/">Playground</a>
  </header>
  <p class="intro">Every v1 widget that exists so far, at each size it supports, in both themes, at the real sizes the grid gives it.
    All figures are synthetic. Today's P&amp;L and the session clock run on the same clock as the controls below.</p>

  <div class="controls" role="group" aria-label="Gallery controls">
    <fieldset class="control">
      <legend>Time</legend>
      <label><input type="radio" name="time" value="frozen" checked> Frozen at 11:42:20 IST on a weekday</label>
      <label><input type="radio" name="time" value="live"> Live</label>
    </fieldset>
    <fieldset class="control">
      <legend>Today's P&amp;L</legend>
      <label><input type="checkbox" id="loss"> Loss day</label>
    </fieldset>
  </div>

  <div id="themes"></div>
</div>

<script type="module">
  import { configure, createCalendar, presets, localDate, zonedTime } from '/src/core/index.js'
  import '/src/elements/index.js'

  const TZ = 'Asia/Kolkata'
  configure({ locale: 'en-IN', currency: 'INR', timeZone: TZ })

  // ── Synthetic data. Nothing here comes from a real account or a design sheet. ──

  // A small seeded generator, so the same curves appear on every load.
  function seeded(seed) {
    let a = seed
    return () => {
      a = (a + 0x6d2b79f5) | 0
      let t = Math.imul(a ^ (a >>> 15), 1 | a)
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }

  const DAY_MS = 86400000
  const shiftDay = (iso, n) => new Date(Date.parse(`${iso}T00:00:00Z`) + n * DAY_MS).toISOString().slice(0, 10)
  const isWeekend = (iso) => [0, 6].includes(new Date(`${iso}T00:00:00Z`).getUTCDay())
  function weekdayOnOrBefore(iso) {
    while (isWeekend(iso)) iso = shiftDay(iso, -1)
    return iso
  }

  // "Frozen" is 11:42:20 on the latest weekday, so the sessions and the
  // intraday curve always describe a trading day, whenever the page is opened.
  const TODAY = weekdayOnOrBefore(localDate(Date.now(), TZ))
  const FROZEN = zonedTime(TODAY, '11:42', TZ) + 20000

  const calendar = createCalendar({ sessions: [presets.nse({ segment: 'derivatives' }), presets.mcx()] })

  const smooth = (a, b, x) => {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)))
    return t * t * (3 - 2 * t)
  }

  // A morning that dips early, then climbs: minute readings from the open to the frozen time.
  function todayPnl(loss) {
    const hours = calendar.hours('nse-fo', TODAY)
    const rng = seeded(7)
    const sign = loss ? -1 : 1
    const span = FROZEN - hours.open
    const intraday = []
    let wobble = 0
    for (let t = hours.open; t <= FROZEN; t += 60000) {
      const f = (t - hours.open) / span
      wobble = wobble * 0.9 + (rng() - 0.5) * 36
      const shape = 0.9 * smooth(0.1, 0.85, f) + 0.1 * f - 0.35 * Math.exp(-(((f - 0.1) / 0.06) ** 2)) + 0.04 * Math.sin(f * 14)
      intraday.push({ t, v: Math.round((sign * (2600 * shape + wobble)) * 100) / 100 })
    }
    const net = intraday[intraday.length - 1].v
    const fees = 184.6
    const unrealized = Math.round(net * 0.38 * 100) / 100
    const at = (f) => intraday[Math.floor((intraday.length - 1) * f)].t
    return {
      net,
      unrealized,
      realized: Math.round((net + fees - unrealized) * 100) / 100,
      fees,
      closedCount: 9,
      openCount: 2,
      intraday,
      marks: [
        { t: at(0.14), kind: 'entry' },
        { t: at(0.38), kind: 'exit' },
        { t: at(0.52), kind: 'entry' },
        { t: at(0.81), kind: 'exit' },
      ],
      window: { from: hours.open, to: hours.close },
      asOf: FROZEN,
      live: true,
    }
  }

  // About 60 weekdays: a rise, a drawdown, then a recovery.
  function equityCurve() {
    const rng = seeded(42)
    const dates = []
    for (let d = weekdayOnOrBefore(shiftDay(TODAY, -1)); dates.length < 60; d = weekdayOnOrBefore(shiftDay(d, -1))) dates.unshift(d)
    const days = dates.map((date, i) => {
      const drift = i < 22 ? 650 : i < 40 ? -1150 : 900
      return { date, pnl: Math.round(drift + (rng() - 0.5) * 4200), trades: 2 + Math.floor(rng() * 8) }
    })
    return { days, fees: 21460.35, trades: days.reduce((sum, d) => sum + d.trades, 0) }
  }

  const sessionClock = { calendar, sessions: ['nse-fo', 'mcx'], timeframes: [5, 15] }

  const DATA = {
    'ts-today-pnl': () => todayPnl(lossDay),
    'ts-equity-curve': (() => { const data = equityCurve(); return () => data })(),
    'ts-session-clock': () => sessionClock,
  }

  // ── What to show ──

  // Sizes in px as the grid gives them: desktop at 4 columns, phone at 2.
  const DESKTOP = { S: [304, 150], Wide: [624, 150], M: [624, 316], XL: [1264, 316], Banner: [1264, 150] }
  const PHONE = { S: [170, 150], Wide: [351, 150], M: [351, 310], Banner: [351, 150] }

  const GALLERY = [
    { tag: 'ts-today-pnl', title: "Today's P&L", desktop: ['S', 'Wide', 'M'], phone: ['S', 'Wide', 'M'], emptySize: 'M' },
    { tag: 'ts-equity-curve', title: 'Equity curve', desktop: ['Wide', 'M', 'XL'], phone: ['Wide', 'M'], emptySize: 'M' },
    { tag: 'ts-session-clock', title: 'Session clock', desktop: ['S', 'Banner'], phone: ['S', 'Banner'], emptySize: 'S' },
  ]

  const THEMES = [
    { id: 'light', name: 'Paper' },
    { id: 'dark', name: 'Traed Dark' },
  ]

  let lossDay = false
  let frozen = true
  const instances = []

  function make(tag, size, [width, height], empty) {
    const el = document.createElement(tag)
    el.setAttribute('size', size)
    el.style.width = `${width}px`
    instances.push({ el, tag, empty })
    const figure = document.createElement('figure')
    const caption = document.createElement('figcaption')
    caption.textContent = `${size} · ${width} × ${height}${empty ? ' · no data' : ''}`
    figure.append(el, caption)
    return figure
  }

  function group(heading, items, phone) {
    const h = document.createElement('h4')
    h.textContent = heading
    const set = document.createElement('div')
    set.className = phone ? 'set phone' : 'set'
    set.append(...items)
    return [h, set]
  }

  const themesEl = document.getElementById('themes')
  for (const theme of THEMES) {
    const block = document.createElement('section')
    block.className = 'theme'
    block.dataset.theme = theme.id
    // The block can scroll sideways, so keyboard users need to be able to focus it.
    block.tabIndex = 0
    block.setAttribute('aria-labelledby', `theme-${theme.id}`)
    const h2 = document.createElement('h2')
    h2.id = `theme-${theme.id}`
    h2.textContent = theme.name
    block.append(h2)

    for (const w of GALLERY) {
      const h3 = document.createElement('h3')
      h3.textContent = w.title
      block.append(
        h3,
        ...group('Desktop', w.desktop.map((s) => make(w.tag, s, DESKTOP[s], false))),
        ...group('Phone', w.phone.map((s) => make(w.tag, s, PHONE[s], false)), true),
        ...group('Empty state', [make(w.tag, w.emptySize, DESKTOP[w.emptySize], true)]),
      )
    }
    themesEl.append(block)
  }

  // ── Controls ──

  const frozenClock = () => FROZEN
  function apply() {
    for (const { el, tag, empty } of instances) {
      el.clock = frozen ? frozenClock : null
      el.data = empty ? null : DATA[tag]()
    }
  }

  for (const radio of document.querySelectorAll('input[name="time"]')) {
    radio.addEventListener('change', () => {
      frozen = radio.value === 'frozen'
      apply()
    })
  }
  document.getElementById('loss').addEventListener('change', (e) => {
    lossDay = e.target.checked
    apply()
  })

  apply()
</script>
</body>
</html>
