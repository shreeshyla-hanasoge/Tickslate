name: Feature request
description: Suggest a change to an existing widget, the grid, the core or the docs.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A new public name (an element, attribute, event, token or export) is agreed in an RFC first, so this issue is where that conversation starts. See [CONTRIBUTING.md](https://github.com/shreeshyla-hanasoge/Tickslate/blob/master/CONTRIBUTING.md).

        Want a whole new widget? Use the widget request form instead.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you can't do today, or can only do with a workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behaviour, and the markup or code you would write. Names are welcome but optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds, other libraries, and why they fall short.
  - type: textarea
    id: data-shape
    attributes:
      label: The data involved
      description: If the feature touches the data a widget takes in, show a made-up example of its shape.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browsers you need it in
      description: Tickslate supports Chrome 111, Safari 16.2 and Firefox 113 or later.
      placeholder: "Chrome and Safari, desktop and iOS"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: How do you use Tickslate?
      options:
        - Plain HTML
        - Vue
        - React
        - Svelte
        - Angular
        - Server-rendered template (Laravel, Rails, Django and others)
        - Another framework
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, with guidance"
        - "Yes, I can write the RFC"
        - "No, I'm only suggesting it"
    validations:
      required: true
