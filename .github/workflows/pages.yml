name: Pages

# Builds the demo site (dist-site/) and deploys it to GitHub Pages.
#
# It stays idle until the maintainer turns it on, in two steps that only the
# maintainer can take:
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables: add
#      PAGES_ENABLED with the value true.
# Until the variable is set, a push to master shows these jobs as skipped
# rather than failing on a Pages site that does not exist yet.
#
# The site is served at https://<owner>.github.io/Tickslate/, which is the
# base vite.site.config.js builds for. Change both together if the repository
# is renamed.

on:
  push:
    branches: [master]
  workflow_dispatch:

# The deploy job needs these; the build job only reads the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy in flight finishes rather than being cut
# off by a newer push (Pages keeps the last one that completed).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The build fails if any page would load something from another host.
      - run: npm run build:site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-site

  deploy:
    name: deploy
    needs: build
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
