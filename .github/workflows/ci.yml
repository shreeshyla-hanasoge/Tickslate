name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the published manifest advertises in "engines".
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No install on purpose: the suite imports nothing outside src/ and node:*.
      - run: npm test

  build:
    name: build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The same chain the maintainer runs before publishing (test, build:lib,
      # build:dev, build:umd, pack:lib, verify:package, size), so CI can't pass a
      # package that a local release would refuse.
      - run: npm run release
      - name: What would be published
        run: npm pack --dry-run ./dist-lib
      # The exact files a release would publish, kept for inspection or a
      # by-hand check of a PR's build.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-lib
          path: dist-lib/
          if-no-files-found: error
          retention-days: 14
