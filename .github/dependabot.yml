# Dependency updates (RFC 0004 §8.5). Weekly, labelled, and never auto-merged: the
# maintainer reads every pull request. Dependabot keeps the commit SHAs in the
# workflows current, so the pins never go stale.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # Minor and patch updates arrive as one pull request a week; a major update
      # is left to open its own, because it can break the build.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
