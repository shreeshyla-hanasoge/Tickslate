<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickslate playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="/src/themes/tokens.css">
<style>
  body { margin: 0; background: var(--ts-bg); color: var(--ts-ink); font-family: var(--ts-font-ui); }
  .page { max-width: 1312px; margin: 0 auto; padding: 24px 24px 96px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-bottom: 20px; }
  h1 { font: 500 28px/1 var(--ts-font-num); margin: 0; flex: 1 1 auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; }
  .bar button {
    min-height: 36px; padding: 0 14px; border-radius: var(--ts-radius-sm); cursor: pointer;
    border: 1px solid var(--ts-line); background: var(--ts-surface); color: var(--ts-ink); font: 500 13px var(--ts-font-ui);
  }
  .bar button[aria-pressed="true"] { background: var(--ts-ink); color: var(--ts-bg); border-color: var(--ts-ink); }
  .bar button.primary { background: var(--ts-accent); color: var(--ts-surface); border-color: var(--ts-accent); }
  .gallery { color: var(--ts-accent); font-size: 13px; font-weight: 500; }
  .hint { color: var(--ts-muted); font-size: 13px; margin: 0 0 16px; }
  .log { position: fixed; left: 16px; bottom: 16px; max-width: calc(100% - 32px); padding: 8px 12px; border-radius: var(--ts-radius-sm);
    background: var(--ts-surface); border: 1px solid var(--ts-line); color: var(--ts-muted); font: 12px ui-monospace, monospace; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 0 0 12px; font-size: 13px; color: var(--ts-muted); }
  .status .num { font: var(--ts-num-weight) 20px/1 var(--ts-font-num); font-variant-numeric: tabular-nums lining-nums; color: var(--ts-ink); }
  .status .open { color: var(--ts-profit); font-weight: 600; }
  .status .shut { color: var(--ts-muted); font-weight: 600; }
  .pretend { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
  .pretend input, .pretend button { font: 13px var(--ts-font-ui); min-height: 30px; border-radius: var(--ts-radius-sm); border: 1px solid var(--ts-line); background: var(--ts-surface); color: var(--ts-ink); padding: 0 8px; }
  .samples { margin: 0 0 12px; font-size: 13px; color: var(--ts-muted); }
  .samples summary { cursor: pointer; }
  .samples div { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; padding-top: 8px; }
  .samples b { font: var(--ts-num-weight) 15px var(--ts-font-num); font-variant-numeric: tabular-nums lining-nums; color: var(--ts-ink); }
  @media (max-width: 699px) { .page { padding: 16px 12px 96px; } .pretend { margin-left: 0; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Tickslate</h1>
    <a class="gallery" href="/widgets.html">Widget gallery</a>
    <div class="bar" role="group" aria-label="Profile">
      <button type="button" data-profile="auto" aria-pressed="true">Auto</button>
      <button type="button" data-profile="market" aria-pressed="false">Market hours</button>
      <button type="button" data-profile="closed" aria-pressed="false">After close</button>
    </div>
    <div class="bar" role="group" aria-label="Theme">
      <button type="button" data-theme-pick="light" aria-pressed="false">Paper</button>
      <button type="button" data-theme-pick="dark" aria-pressed="false">Traed Dark</button>
    </div>
    <div class="bar">
      <button type="button" id="reset">Reset layout</button>
      <button type="button" id="edit" class="primary">Edit</button>
    </div>
  </header>
  <div class="status" aria-live="off">
    <span id="clock" class="num"></span>
    <span id="sessions"></span>
    <label class="pretend">Pretend it's <input type="time" id="pretend" step="1"> IST
      <button type="button" id="live">Live</button></label>
  </div>
  <details class="samples"><summary>Formatting samples (en-IN, INR)</summary><div id="samples"></div></details>
  <p class="hint">Long-press a tile (or press Edit) to rearrange. Drag tiles, drag the corner handle to resize, tap − to remove.
    Keyboard: Tab to a tile in edit mode, Space to pick up, arrows to move, Space to drop, + and − to resize.</p>

  <ts-grid id="grid" locale="en-IN" currency="INR">
    <ts-today-pnl item="todayPnl" label="Today's P&amp;L"></ts-today-pnl>
    <ts-session-clock item="sessionClock" label="Session clock"></ts-session-clock>
    <play-tile item="openPositions" label="Open positions"></play-tile>
    <play-tile item="capitalFunding" label="Capital funding"></play-tile>
    <play-tile item="watchlist" label="Watchlist"></play-tile>
    <play-tile item="edgeStats" label="Edge stats"></play-tile>
    <play-tile item="chart-nifty" label="Mini chart · NIFTY"></play-tile>
    <play-tile item="chart-crude" label="Mini chart · CRUDE"></play-tile>
    <ts-equity-curve item="equityCurve" label="Equity curve"></ts-equity-curve>
    <play-tile item="pnlCalendar" label="Daily P&amp;L calendar"></play-tile>
  </ts-grid>
</div>
<div class="log" id="log" aria-live="off">No edits yet.</div>

<script type="module">
  import { createCalendar, createFormatter, presets, zonedTime, localDate } from '/src/core/index.js'
  import '/src/elements/index.js'

  // A stand-in tile for the widgets that don't exist yet: shows its label and the
  // size the grid asked for, and has a button so you can check a drag never
  // clicks it.
  class PlayTile extends HTMLElement {
    static get observedAttributes() { return ['size', 'label'] }
    constructor() {
      super()
      this.attachShadow({ mode: 'open' }).innerHTML = `
        <style>
          :host { display: block; }
          .tile { box-sizing: border-box; height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 8px;
            background: var(--ts-surface); border: 1px solid var(--ts-line); border-radius: var(--ts-radius);
            box-shadow: var(--ts-shadow); color: var(--ts-ink); overflow: hidden; }
          .hd { display: flex; align-items: center; gap: 8px; }
          .lb { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--ts-muted); flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .sz { font: 600 10px var(--ts-font-ui); padding: 2px 6px; border-radius: var(--ts-radius-sm); background: var(--ts-surface-2); color: var(--ts-muted); }
          .big { font: var(--ts-num-weight) 34px/1 var(--ts-font-num); font-variant-numeric: tabular-nums lining-nums; }
          .bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 4px; }
          .bars[hidden] { display: none; }
          .bars i { flex: 1; border-radius: 3px 3px 1px 1px; background: color-mix(in srgb, var(--ts-accent) 28%, transparent); }
          button { align-self: flex-start; font: 500 12px var(--ts-font-ui); min-height: 28px; padding: 0 10px; border-radius: var(--ts-radius-sm);
            border: 1px solid var(--ts-line); background: transparent; color: var(--ts-accent); cursor: pointer; }
        </style>
        <section class="tile" aria-label="">
          <div class="hd"><span class="lb"></span><span class="sz"></span></div>
          <span class="big"></span>
          <div class="bars" aria-hidden="true"></div>
          <button type="button">Details</button>
        </section>`
      const bars = this.shadowRoot.querySelector('.bars')
      for (let i = 0; i < 14; i++) {
        const bar = document.createElement('i')
        bar.style.height = `${20 + ((i * 37) % 70)}%`
        bars.appendChild(bar)
      }
      this.shadowRoot.querySelector('button').addEventListener('click', () => log(`Clicked Details on ${this.getAttribute('label')}`))
    }
    attributeChangedCallback() {
      const label = this.getAttribute('label') || ''
      const size = this.getAttribute('size') || ''
      this.shadowRoot.querySelector('.lb').textContent = label
      this.shadowRoot.querySelector('.sz').textContent = size
      this.shadowRoot.querySelector('.big').textContent = size
      this.shadowRoot.querySelector('section').setAttribute('aria-label', label)
      this.shadowRoot.querySelector('.bars').hidden = size === 'S' || size === 'Wide' || size === 'Banner'
    }
  }
  customElements.define('play-tile', PlayTile)

  const defaults = {
    version: 1,
    device: 'desktop',
    profiles: {
      market: [
        { id: 'todayPnl', size: 'Wide' },
        { id: 'sessionClock', size: 'S' },
        { id: 'edgeStats', size: 'S' },
        { id: 'openPositions', size: 'M' },
        { id: 'capitalFunding', size: 'Tall' },
        { id: 'watchlist', size: 'Tall' },
        { id: 'chart-nifty', type: 'miniChart', size: 'M' },
        { id: 'chart-crude', type: 'miniChart', size: 'M' },
      ],
      closed: [
        { id: 'todayPnl', size: 'Wide' },
        { id: 'sessionClock', size: 'S' },
        { id: 'edgeStats', size: 'S' },
        { id: 'equityCurve', size: 'XL' },
        { id: 'pnlCalendar', size: 'Banner' },
        { id: 'capitalFunding', size: 'S' },
        { id: 'watchlist', size: 'S' },
      ],
    },
  }

  const grid = document.getElementById('grid')
  const logEl = document.getElementById('log')
  function log(text) { logEl.textContent = text }

  const KEY = 'tickslate-playground-layout'
  // Local storage can be missing or blocked; the playground still works.
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) } catch { return null } }
  function save(layout) { try { localStorage.setItem(KEY, JSON.stringify(layout)) } catch {} }

  grid.layout = load() || defaults
  grid.addEventListener('ts-layout-change', (e) => {
    save(e.detail.layout)
    const ids = e.detail.layout.profiles[e.detail.profile].map((i) => `${i.id}:${i.size}`).join('  ')
    log(`${e.detail.reason} ${e.detail.id} → ${ids}`)
  })
  grid.addEventListener('ts-layout-issues', (e) => log(`Layout repaired: ${e.detail.issues.map((i) => i.message).join(' ')}`))
  grid.addEventListener('ts-columns-change', (e) => log(`${e.detail.columns} columns`))

  const edit = document.getElementById('edit')
  edit.addEventListener('click', () => { grid.editing = !grid.editing })
  grid.addEventListener('ts-edit-change', (e) => { edit.textContent = e.detail.editing ? 'Done' : 'Edit' })

  document.getElementById('reset').addEventListener('click', () => {
    grid.layout = defaults
    save(defaults)
    log('Layout reset.')
  })

  // ── Sessions, the profile schedule and a pretend clock ──
  const fmt = createFormatter({ locale: 'en-IN', currency: 'INR', timeZone: 'Asia/Kolkata' })
  const calendar = createCalendar({ sessions: [presets.nse({ segment: 'derivatives' }), presets.mcx()] })
  // Traed's market hours: NSE F&O widened to 09:00–15:45.
  grid.schedule = { calendar, market: { sessions: ['nse-fo'], leadMinutes: 15, lagMinutes: 5 } }

  let offset = 0
  const now = () => Date.now() + offset
  grid.clock = now
  const pretend = document.getElementById('pretend')
  pretend.addEventListener('change', () => {
    if (!pretend.value) return
    const [h, m, sec = '00'] = pretend.value.split(':')
    const today = localDate(Date.now(), 'Asia/Kolkata')
    offset = zonedTime(today, `${h}:${m}`, 'Asia/Kolkata') + Number(sec) * 1000 - Date.now()
    grid.clock = now
    tick()
  })
  document.getElementById('live').addEventListener('click', () => {
    offset = 0
    pretend.value = ''
    grid.clock = now
    tick()
  })

  // ── Widget data (all synthetic) ──
  const TZ = 'Asia/Kolkata'
  const pnlEl = grid.querySelector('[item="todayPnl"]')
  const clockEl = grid.querySelector('[item="sessionClock"]')
  const equityEl = grid.querySelector('[item="equityCurve"]')
  // Same function the grid uses, so "Pretend it's" moves the widgets too.
  for (const el of [pnlEl, clockEl, equityEl]) el.clock = now

  clockEl.data = { calendar, sessions: ['nse-fo', 'mcx'], timeframes: [5, 15] }

  // Today's P&L: a random walk, one reading every 2s, over today's NSE F&O session.
  let readings = []
  function reseedPnl() {
    const t = now()
    const hours = calendar.hours('nse-fo', localDate(t, TZ))
    // Readings stay inside the session: the curve is drawn on its window.
    const from = hours && t > hours.open ? hours.open : t
    const to = hours ? Math.min(t, Math.max(hours.close, from)) : t
    let v = 0
    readings = []
    for (let at = from; at < to; at += 60000) {
      v += (Math.random() - 0.45) * 80
      readings.push({ t: at, v: Math.round(v * 100) / 100 })
    }
    readings.push({ t: to, v: Math.round(v * 100) / 100 })
    publishPnl(hours)
  }
  function publishPnl(hours = calendar.hours('nse-fo', localDate(now(), TZ))) {
    const net = readings[readings.length - 1].v
    const fees = Math.round((95 + Math.abs(net) * 0.012) * 100) / 100
    const unrealized = Math.round(net * 0.4 * 100) / 100
    pnlEl.data = {
      net, unrealized, fees,
      realized: Math.round((net + fees - unrealized) * 100) / 100,
      closedCount: 6,
      openCount: 2,
      intraday: readings,
      window: hours ? { from: hours.open, to: hours.close } : undefined,
      asOf: now(),
      live: !!hours && now() >= hours.open && now() <= hours.close,
    }
  }
  function tickPnl() {
    const t = now()
    const hours = calendar.hours('nse-fo', localDate(t, TZ))
    // Outside the session there is nothing to add to today's curve.
    if (!hours || t < hours.open || t > hours.close) return publishPnl(hours)
    // After "Pretend it's" jumps back, readings from the future are dropped.
    while (readings.length && readings[readings.length - 1].t >= t) readings.pop()
    const last = readings.length ? readings[readings.length - 1].v : 0
    readings.push({ t, v: Math.round((last + (Math.random() - 0.48) * 40) * 100) / 100 })
    publishPnl()
  }
  reseedPnl()
  setInterval(tickPnl, 2000)
  // A jump in the pretend clock changes what "today so far" means.
  pretend.addEventListener('change', reseedPnl)
  document.getElementById('live').addEventListener('click', reseedPnl)

  // Equity curve: about 60 weekdays of daily P&L with a rise, a drawdown and a recovery.
  {
    const days = []
    const date = new Date(Date.parse(`${localDate(Date.now(), TZ)}T00:00:00Z`))
    while (days.length < 60) {
      date.setUTCDate(date.getUTCDate() - 1)
      if (date.getUTCDay() % 6 === 0) continue
      const i = 59 - days.length
      const drift = i < 22 ? 650 : i < 40 ? -1150 : 900
      days.unshift({ date: date.toISOString().slice(0, 10), pnl: Math.round(drift + (Math.random() - 0.5) * 4200), trades: 2 + Math.floor(Math.random() * 8) })
    }
    equityEl.data = { days, fees: 21460.35, trades: days.reduce((sum, d) => sum + d.trades, 0) }
  }

  const profileButtons = document.querySelectorAll('[data-profile]')
  function showProfileChoice(choice) {
    for (const b of profileButtons) b.setAttribute('aria-pressed', String(b.dataset.profile === choice))
  }
  for (const button of profileButtons) {
    button.addEventListener('click', () => {
      const choice = button.dataset.profile
      grid.override(choice === 'auto' ? null : choice)
      showProfileChoice(choice)
    })
  }
  grid.addEventListener('ts-profile-change', (e) => {
    log(`Profile ${e.detail.profile} (${e.detail.reason})`)
    if (e.detail.reason !== 'override') showProfileChoice('auto')
  })

  const sessionsEl = document.getElementById('sessions')
  function tick() {
    const t = now()
    document.getElementById('clock').textContent = `${fmt.time(t, { seconds: true })} IST`
    sessionsEl.innerHTML = calendar.sessions.map((id) => {
      const s = calendar.state(id, t)
      const label = calendar.session(id).label
      if (s.open) {
        const candle = calendar.candleClose(id, t, 5)
        return `${label} <span class="open">open</span> · closes ${fmt.time(s.closesAt)} (${fmt.duration(s.closesAt - t, { style: 'words' })}) · 5m candle ${fmt.duration(candle - t)}`
      }
      return `${label} <span class="shut">closed</span>${s.opensAt ? ` · opens ${fmt.time(s.opensAt)} in ${fmt.duration(s.opensAt - t, { style: 'words' })}` : ''}`
    }).join(' &nbsp;·&nbsp; ') + ` &nbsp;·&nbsp; layout: <b>${grid.profile}</b>`
  }
  tick()
  setInterval(tick, 1000)

  const samples = [
    ['Gain', fmt.money(1523.85)], ['Loss', fmt.money(-141)], ['Zero', fmt.money(0)],
    ['Lakh grouping', fmt.money(152385)], ['Compact', fmt.money(1800, { compact: true })],
    ['Compact loss', fmt.money(-330000, { compact: true })], ['Balance (no plus)', fmt.money(82949.68, { sign: 'negative' })],
    ['Price', fmt.price(22512.4)], ['Change', fmt.percent(0.013)], ['Win rate', fmt.percent(0.21, { decimals: 0, sign: 'negative' })],
    ['Countdown', fmt.duration(160000)], ['Time left', fmt.duration(13680000, { style: 'words' })],
  ]
  document.getElementById('samples').innerHTML = samples.map(([k, v]) => `<span>${k}: <b>${v}</b></span>`).join('')

  const root = document.documentElement
  function pickTheme(theme) {
    root.dataset.theme = theme
    for (const b of document.querySelectorAll('[data-theme-pick]')) b.setAttribute('aria-pressed', String(b.dataset.themePick === theme))
  }
  for (const b of document.querySelectorAll('[data-theme-pick]')) b.addEventListener('click', () => pickTheme(b.dataset.themePick))
  pickTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
</script>
</body>
</html>
