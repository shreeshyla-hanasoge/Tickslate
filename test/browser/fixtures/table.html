<!doctype html>
<!-- One <ts-table> for the table spec. ?size=Tall|M|L|XL, ?width=px (the tile's width), ?rows=n, ?theme=light|dark,
     ?preset=terminal (or calm, signal...), ?fit caps the width at the viewport's, ?select puts 'select' in actions, ?sort=0 sends no sort in the data.
     The spec drives it through window.__t: tick(n) sends the same rows with live figures moved, and events collects
     every ts-action. Nothing is loaded from the network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table fixture</title>
<link rel="stylesheet" href="/src/themes/tokens.css">
<style>
  body { margin: 0; background: var(--ts-bg); color: var(--ts-ink); font-family: var(--ts-font-ui); }
  main { padding: 16px; }
  #wrap { max-width: none; }
</style>
</head>
<body>
<main>
  <div id="wrap"><ts-table id="t" label="Strategies"></ts-table></div>
</main>
<script type="module">
  import '/src/elements/index.js'
  import { setup, table, frozenClock } from './data.js'

  setup()
  const params = new URLSearchParams(location.search)
  document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light'
  const preset = params.get('preset')
  if (/^[a-z]+$/.test(preset || '')) {
    await new Promise((resolve) => {
      const link = document.createElement('link')
      link.rel = 'stylesheet'
      link.href = `/src/themes/presets/${preset}.css`
      link.onload = link.onerror = resolve
      document.head.append(link)
    })
    document.documentElement.dataset.tsTheme = preset
  }

  const el = document.getElementById('t')
  const rows = Number(params.get('rows') || 16)
  const scale = Number(params.get('scale') || 1)
  el.setAttribute('size', params.get('size') || 'M')
  document.getElementById('wrap').style.width = `${params.get('width') || 640}px`
  // ?fit keeps the tile inside the viewport, so a touch screen can reach every control without scrolling sideways.
  if (params.has('fit')) document.getElementById('wrap').style.maxWidth = '100%'
  el.clock = frozenClock
  if (params.has('select')) el.actions = ['select']
  const events = []
  el.addEventListener('ts-action', (e) => events.push(e.detail))
  const data = (tick) => {
    const d = table(scale, rows, tick)
    if (params.get('sort') === '0') delete d.sort
    return d
  }
  el.data = data(0)

  window.__t = {
    el,
    events,
    tick: (n) => { el.data = data(n) },
    width: (px) => { document.getElementById('wrap').style.width = `${px}px` },
    nextFrame: () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))),
  }
  window.__ready = true
</script>
</body>
</html>
