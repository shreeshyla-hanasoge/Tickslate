<!doctype html>
<!-- Every registered widget at every size it supports, in one theme chosen by
     ?theme=light|dark|default (default: no data-theme). It loads nothing from the network. The spec drives it
     through window.__fx. ?exact=1 sizes each tile to its real column width. ?fill=1 puts a height: 100% element in each card.
     ?preset=terminal (or calm, signal...) loads that theme preset (src/themes/presets/)
     and puts it on the page, beside data-theme, as a host would. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget fixture</title>
<link rel="stylesheet" href="/src/themes/tokens.css">
<style>
  body { margin: 0; background: var(--ts-bg); color: var(--ts-ink); font-family: var(--ts-font-ui); }
  main { padding: 16px; }
  h1 { font: 600 20px/1.2 var(--ts-font-ui); margin: 0 0 12px; }
  h2 { font: 600 15px/1.2 var(--ts-font-ui); margin: 24px 0 8px; }
  .set { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure { margin: 0; max-width: 100%; }
  figcaption { margin-top: 4px; font-size: 12px; color: var(--ts-muted); }
  .fill { height: 100%; background: var(--ts-surface-2); }
  ul { margin: 0; padding: 0; list-style: none; }
</style>
</head>
<body>
<script>
  // These specs read every tile on a long page, drawn or not. Off-screen widgets skip renders by design (RFC 0003 §23),
  // so this page opts out by having no IntersectionObserver. The gating itself (first draw, later renders, print, display: contents) runs on every engine in test/browser/perf.spec.mjs, on freshness.html, which keeps the observer.
  delete window.IntersectionObserver
</script>
<main id="stage">
  <h1>Widget fixture</h1>
</main>
<script type="module">
  import { WIDGETS, SIZES, SIZE_NAMES } from '/src/core/index.js'
  import '/src/elements/index.js'
  // The one widget the all-in entry leaves out: it draws with the optional peer Emberwick, which is a dev dependency here.
  import '/src/elements/define/mini-chart.js'
  import { setup, dataFor, frozenClock, fillCard } from './data.js'

  setup()
  const params = new URLSearchParams(location.search)
  // ?theme=default leaves data-theme off, so a host that sets none sees the bare :root palette.
  const theme = params.get('theme') === 'dark' ? 'dark' : params.get('theme') === 'default' ? 'default' : 'light'
  const fill = params.has('fill')
  const exact = params.has('exact')
  if (theme !== 'default') document.documentElement.dataset.theme = theme
  // A preset is its own file, and reaches the widgets as tokens through the page's data-ts-theme. The page is ready
  // only once the file has loaded, or the first measurement would be of the default tokens.
  const preset = params.get('preset')
  if (/^[a-z]+$/.test(preset || '')) {
    await new Promise((resolve) => {
      const link = document.createElement('link')
      link.rel = 'stylesheet'
      link.href = `/src/themes/presets/${preset}.css`
      link.onload = link.onerror = resolve
      document.head.append(link)
    })
    document.documentElement.dataset.tsTheme = preset
  }
  const stage = document.getElementById('stage')

  // Widths as a 4-column desktop grid gives them. A narrow viewport shrinks the
  // tile instead of scrolling the page; only the height is under test.
  const widthOf = (size) => SIZES[size].cols * 304 + (SIZES[size].cols - 1) * 16

  const defined = (tag) => !!customElements.get(tag)
  const entries = Object.entries(WIDGETS).filter(([, spec]) => defined(spec.tag)).map(([key, spec]) => ({ key, tag: spec.tag, label: spec.label, sizes: [...spec.sizes] }))
  const tiles = new Map()

  for (const entry of entries) {
    const h2 = document.createElement('h2')
    h2.textContent = entry.label
    const set = document.createElement('div')
    set.className = 'set'
    for (const size of entry.sizes) {
      const el = document.createElement(entry.tag)
      el.setAttribute('size', size)
      el.dataset.key = entry.key
      el.dataset.size = size
      el.style.width = `min(${widthOf(size)}px, 100%)`
      if (entry.tag === 'ts-card') {
        if (fill) {
          el.setAttribute('label', 'Fill')
          el.insertAdjacentHTML('beforeend', '<div class="fill"></div>')
        } else fillCard(el, size)
      }
      el.clock = frozenClock
      el.data = dataFor(entry.tag)
      const figure = document.createElement('figure')
      const caption = document.createElement('figcaption')
      caption.textContent = `${size} · ${SIZES[size].cols} × ${SIZES[size].rows}`
      // A percentage width inside a shrink-to-fit flex item collapses to the content's width (a 304 px tile would be
      // 44 px). ?exact=1 gives the figure the width and the tile all of it, for the pixel comparison.
      if (exact) {
        figure.style.width = el.style.width
        el.style.width = '100%'
      }
      figure.append(el, caption)
      set.append(figure)
      tiles.set(`${entry.key}:${size}`, el)
    }
    stage.append(h2, set)
  }

  const modes = {
    data: (el, scale) => { el.state = null; el.error = null; el.data = dataFor(el.localName, scale) },
    loading: (el) => { el.error = null; el.data = undefined; el.state = 'loading' },
    empty: (el) => { el.state = null; el.error = null; el.data = null },
    error: (el) => { el.state = null; el.data = dataFor(el.localName); el.actions = ['retry']; el.error = "Couldn't reach the data service" },
  }

  window.__fx = {
    theme,
    entries,
    tiles,
    sizeNames: SIZE_NAMES,
    setMode(el, mode, scale = 1) { modes[mode](el, scale) },
    box(el) {
      const r = el.getBoundingClientRect()
      return { w: r.width, h: r.height }
    },
    nextFrame: () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))),
  }
  window.__ready = true
</script>
</body>
</html>
